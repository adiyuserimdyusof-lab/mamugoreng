<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --wok: #120c08;
        --ember: #e8541a;
        --chili: #b81f17;
        --turmeric: #ffd04d;
        --cream: #fff3dc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--wok);
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="heat"
        class="clip"
        data-composition-id="heat"
        data-composition-src="compositions/heat.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="toss"
        class="clip"
        data-composition-id="toss"
        data-composition-src="compositions/toss.html"
        data-start="4.5"
        data-duration="5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="mark"
        class="clip"
        data-composition-id="mark"
        data-composition-src="compositions/mark.html"
        data-start="9.5"
        data-duration="5.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
