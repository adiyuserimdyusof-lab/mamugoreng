  <script>
    const tl = gsap.timeline({ paused: true });

    // Noodles land in the frame, drawn strand by strand.
    tl.fromTo(".toss-strand", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power3.out", stagger: 0.06 }, 0.05);

    // The toss: up off the wok, then settling back.
    tl.fromTo("#toss-noodles", { y: 0, rotation: 0, svgOrigin: "960 700" }, { y: -90, rotation: -2.5, duration: 0.8, ease: "power2.out" }, 1.0);
    tl.to("#toss-noodles", { y: 20, rotation: 1, duration: 1.4, ease: "power2.inOut" }, 1.8);
    tl.fromTo("#toss-noodles", { x: 0 }, { x: -140, duration: 4.2, ease: "none" }, 0);

    // Chili and spring onion fly up with the toss and fall back.
    document.querySelectorAll(".toss-chili, .toss-onion").forEach((el, i) => {
      const t = 0.95 + (i % 4) * 0.07;
      const h = 640 + ((i * 89) % 300);
      const dx = ((i * 71) % 240) - 120;
      tl.fromTo(el, { y: 0 }, { y: -h, duration: 0.75, ease: "power2.out" }, t);
      tl.to(el, { y: 60, duration: 0.85, ease: "power2.in" }, t + 0.75);
      tl.fromTo(el, { x: 0, rotation: 0 }, { x: dx, rotation: (i % 2 ? 1 : -1) * 260, duration: 1.6, ease: "none" }, t);
    });

    // The line, word by word from the ground colour to ink.
    tl.fromTo("#toss-line span", { opacity: 0, color: "#f6b08a" }, { opacity: 1, duration: 0.08, ease: "none", stagger: 0.09 }, 1.1);
    tl.to("#toss-line span", { color: "#120c08", duration: 0.25, ease: "power2.out", stagger: 0.09 }, 1.15);
    tl.to("#toss-line", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 4.15);

    // Noodles whip out right as the chili flood rises.
    tl.to("#toss-bowl", { x: 2100, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, 4.2);
    tl.fromTo("#toss-wipe", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" }, 4.45);

    window.__timelines["toss"] = tl;
  </script>
