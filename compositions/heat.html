  <script>
    const tl = gsap.timeline({ paused: true });

    // The wok's heat rises from below the frame.
    tl.fromTo("#heat-glow", { scale: 0.55, opacity: 0.7, y: 120 }, { scale: 1, opacity: 1, y: 0, duration: 1.4, ease: "expo.out" }, 0);

    // Sparks: two launches each, positions fixed by index so every frame renders the same.
    document.querySelectorAll(".heat-spark").forEach((el, i) => {
      for (let n = 0; n < 2; n++) {
        const t = 0.2 + ((i * 0.23) % 1.6) + n * 1.7;
        const rise = 420 + ((i * 97) % 380);
        const drift = ((i * 53) % 160) - 80;
        tl.fromTo(el, { x: 0, y: 0, opacity: 0 }, { x: drift, y: -rise, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.to(el, { x: drift * 1.6, y: -rise * 1.5, opacity: 0, duration: 0.9, ease: "power1.in" }, t + 0.35);
      }
    });

    // Three words, swapped on one stage with a blur.
    const words = ["#heat-w1 span", "#heat-w2 span", "#heat-w3 span"];
    const starts = [0, 1.25, 2.35];
    // "Fire." is already on screen at 0 s, so the first frame (the thumbnail) carries the title.
    tl.fromTo(words[0], { opacity: 1, filter: "blur(0px)", scale: 1 }, { opacity: 1, duration: 0.01 }, 0);
    words.forEach((w, i) => {
      if (i > 0) tl.fromTo(w, { opacity: 0, filter: "blur(10px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.18, ease: "power4.out" }, starts[i]);
      if (i < 2) tl.to(w, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, starts[i + 1] - 0.12);
    });
    tl.to(words[2], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 3.65);

    // The heat's core becomes the next world.
    tl.fromTo("#heat-core", { scale: 0, y: 0 }, { scale: 14, y: -560, duration: 0.75, ease: "power2.inOut" }, 3.7);

    window.__timelines["heat"] = tl;
  </script>
